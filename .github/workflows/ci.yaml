name: CI Build Workflow
description: CI Build Workflow for CloudFormation VPC Subnet Stack run by {{ github.actor }}

on:
  workflow_dispatch:
  push:
    branches:
      - feature/**
      - bug/**
    paths:
      - 'cloudformation/**'
      - .github/workflows/ci.yaml
  pull_request:
    branches: [main]
    paths:
      - 'cloudformation/**'

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  load-config:
    name: Load Stack Configuration
    runs-on: ubuntu-26.04
    outputs:
      stack-name: ${{ steps.config.outputs.stack-name }}
      template-file: ${{ steps.config.outputs.template-file }}
      parameter-file: ${{ steps.config.outputs.parameter-file }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: config
        run: |
          CONFIG=$(cat cloudformation/stack-config.json)
          STACK_NAME=$(echo "$CONFIG" | jq -r '.stackName')
          TEMPLATE_FILE=$(echo "$CONFIG" | jq -r '.templateFile')
          PARAMETER_FILE=$(echo "$CONFIG" | jq -r '.parameterFile')
          echo "stack-name=$STACK_NAME" >> $GITHUB_OUTPUT
          echo "template-file=$TEMPLATE_FILE" >> $GITHUB_OUTPUT
          echo "parameter-file=$PARAMETER_FILE" >> $GITHUB_OUTPUT

          # Write to GitHub step summary
          {
            echo "## Stack Configuration"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Stack Name | \`$STACK_NAME\` |"
            echo "| Template File | \`$TEMPLATE_FILE\` |"
            echo "| Parameter File | \`$PARAMETER_FILE\` |"
          } >> $GITHUB_STEP_SUMMARY

  upload-nested-templates:
    name: Upload Nested Templates to S3
    runs-on: ubuntu-26.04
    environment: ci
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_OIDC_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload nested templates to S3
        run: |
          BUCKET_NAME=$(grep -o 'subhamay-cfn-templates-bucket[^"]*' cloudformation/template.yaml | head -1)
          BUCKET_NAME="${BUCKET_NAME:-subhamay-cfn-templates-bucket-270453428528-us-east-1}"
          S3_PREFIX="cfn-nested-aws-s3-bucket"

          echo "📤 Uploading nested templates to S3..."
          echo "Bucket: $BUCKET_NAME"
          echo "Prefix: $S3_PREFIX"

          if [ -d "templates" ]; then
            aws s3 sync templates/ "s3://$BUCKET_NAME/$S3_PREFIX/" \
              --region "${{ vars.AWS_REGION }}" \
              --exclude "*" \
              --include "*.yaml" \
              --include "*.yml"
            echo "✅ Nested templates uploaded successfully"
          else
            echo "⚠️  No templates directory found, skipping upload"
          fi

  ci-build:
    name: CI Build
    needs: [load-config, upload-nested-templates]
    uses: subhamay-bhattacharyya-gha/cfn-ci-build-reusable-wf/.github/workflows/ci.yaml@main
    with:
      environment: ci
      stack-name: ${{ needs.load-config.outputs.stack-name }}
      template-file: ${{ needs.load-config.outputs.template-file }}
      parameters-file: ${{ needs.load-config.outputs.parameter-file }}

  # ============================================================================
  # Generate Change Log
  # ============================================================================

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-26.04
    needs: ci-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config credential.helper store
          echo "https://github-actions[bot]:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md [skip ci]"
          git pull --rebase
          git push

  # ============================================================================
  # Release Creation
  # ============================================================================

  create-release:
    name: Create Release
    runs-on: ubuntu-26.04
    needs: ci-build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: subhamay-bhattacharyya-gha/create-release-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}