AWSTemplateFormatVersion: '2010-09-09'

Description: 'Nested CloudFormation template for creating an S3 bucket with security defaults and optional encryption'

Parameters:
  ProjectName:
    Type: String
    Description: "Project name to use as a bucket prefix"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Project name must be lowercase letters, numbers, and hyphens only"

  BucketBaseName:
    Type: String
    Description: "Base name for the S3 bucket"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9.-]+$"
    ConstraintDescription: "Bucket base name must be 1-20 characters and can only contain lowercase letters, numbers, hyphens, and dots"

  Environment:
    Type: String
    Default: devl
    Description: "Deployment environment for the S3 bucket"
    AllowedValues:
      - devl
      - stag
      - prod
    ConstraintDescription: "Environment must be one of: devl, stag, prod"

  CiSuffix:
    Type: String
    Default: ""
    Description: "Optional CI suffix to append to the bucket name"

  KmsKey:
    Type: String
    Default: ""
    Description: "Optional KMS Key for S3 bucket encryption"
    AllowedPattern: "^(alias/[a-zA-Z0-9_-]+|arn:aws:kms:[a-z0-9-]+:[0-9]+:key/[a-zA-Z0-9-]+|[a-zA-Z0-9_-]+)?$"
    ConstraintDescription: "KMS Key can be a key name, a KMS key alias (e.g., alias/my-key), or a full KMS key ARN"

  EnableBucketKey:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable S3 Bucket Key for KMS encryption cost optimization (only applicable when KmsKey is provided)"

Conditions:
  HasKmsKey: !Not [!Equals [!Ref KmsKey, ""]]
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]
  EnableBucketKeyCondition: !And
    - !Condition HasKmsKey
    - !Equals [!Ref EnableBucketKey, "true"]

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - HasCiSuffix
        - !Sub "${ProjectName}-${BucketBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}-${CiSuffix}"
        - !Sub "${ProjectName}-${BucketBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        !If
          - HasKmsKey
          - ServerSideEncryptionConfiguration:
              - ServerSideEncryptionByDefault:
                  SSEAlgorithm: aws:kms
                  KMSMasterKeyID: !Ref KmsKey
                BucketKeyEnabled: !If [EnableBucketKeyCondition, true, false]
          - !Ref AWS::NoValue
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  S3BucketName:
    Description: "Name of the S3 bucket"
    Value: !Ref S3Bucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"

  S3BucketArn:
    Description: "ARN of the S3 bucket"
    Value: !GetAtt S3Bucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BucketArn"

  S3BucketRegionalDomainName:
    Description: "Regional domain name of the S3 bucket"
    Value: !GetAtt S3Bucket.RegionalDomainName
    Export:
      Name: !Sub "${AWS::StackName}-RegionalDomainName"
